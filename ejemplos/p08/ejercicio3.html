<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 3 - Rowspan</title>
    <style> table, th, td { border: 1px solid black; border-collapse: collapse; padding: 5px; } </style>
</head>
<body>
    <h2>Ejercicio 3: Combinación de filas</h2>
    <table>
        <tr><td>apples</td><td rowspan="3">oranges</td><td>pears</td></tr>
        <tr><td>bananas</td><td rowspan="2">pineapple</td></tr>
        <tr><td>lychees</td></tr>
    </table>
</body>
</html>
